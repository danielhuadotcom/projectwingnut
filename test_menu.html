<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>wingnut — menu test</title>
<style>
/* the same skeleton tools/build.mjs wraps around the artifact */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* stand-in for the 3D scene: dusk sky with a low sun, ridgelines, a jet */
.fake-scene { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(circle at 72% 60%, rgba(255, 236, 190, 0.95) 0 1.2%, rgba(255, 190, 110, 0.55) 3%, rgba(255, 150, 70, 0) 24%),
              linear-gradient(180deg, #08162a 0%, #1d3e63 34%, #5f6f86 52%, #d49461 63%, #f2b373 66%, #6b5a4a 67%, #2b2a2a 100%); }
.fake-scene i { position: absolute; left: -5%; right: -5%; bottom: 0; }
.fake-scene .r1 { height: 42%; background: #39465a; clip-path: polygon(0 40%, 8% 22%, 15% 34%, 24% 10%, 33% 30%, 41% 18%, 52% 36%, 61% 14%, 70% 32%, 79% 20%, 88% 38%, 100% 16%, 100% 100%, 0 100%); opacity: 0.9; }
.fake-scene .r2 { height: 30%; background: #1b2230; clip-path: polygon(0 30%, 10% 50%, 19% 26%, 30% 46%, 43% 20%, 55% 44%, 66% 28%, 77% 52%, 89% 30%, 100% 46%, 100% 100%, 0 100%); }
.fake-scene svg { position: absolute; left: 62%; top: 38%; width: 14%; min-width: 90px; fill: #1a1f27; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
#banner { position: fixed; z-index: 20; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 12px; font: 12px/1.4 monospace; color: #9cebff; background: rgba(0,0,0,.6); border: 1px solid rgba(156,235,255,.3); pointer-events: none; }
</style>
</head>
<body>
<div id="banner" hidden></div>
<script type="module">
import { Menu, installKind, loadSettings, saveSettings, DEFAULT_SETTINGS, CREDITS, SETTING_DEFS, DIFFICULTY_PICKS, DIFFICULTY_PICKED_KEY, loadDifficultyPicked, saveDifficultyPicked } from './js/menu.js';
import { MISSIONS, countUnits } from './js/missions.js';
import { Input, shapeAxis, STICK_EXPO } from './js/input.js';
import { BINDINGS_KEY, BINDINGS_VERSION, KEY_ACTIONS, DEFAULT_KEYS, loadBindings, sanitizeKeys } from './js/bindings.js';
import { loadBest, saveBest, BEST_KEY } from './js/infinity.js';

window.addEventListener('error', (e) => console.log('MENU_ERR ' + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => console.log('MENU_ERR rejection ' + (e.reason && e.reason.message || e.reason)));
const params = new URLSearchParams(location.search);

// ---- the real page shell (CSS + #game/#ui markup) from src/page.html, minus the game script ----------------------
const src = await (await fetch('./src/page.html', { cache: 'no-store' })).text();
document.body.insertAdjacentHTML('afterbegin', src.replace('<!--SCRIPT-->', ''));
document.querySelector('#gl').innerHTML = '<div class="fake-scene"><i class="r1"></i><i class="r2"></i>' +
  '<svg viewBox="0 0 120 40" aria-hidden="true"><path d="M2 21 L46 17 L60 4 L67 4 L62 17 L96 16 L112 7 L117 8 L111 19 L118 21 L111 23 L117 32 L112 33 L96 25 L62 24 L67 37 L60 37 L46 24 L2 21 Z"/></svg></div>';
document.querySelector('#loading').hidden = true;

// ---- menu under test ------------------------------------------------------------------------------------------
const calls = [], sounds = {};
let selfTest = true, playing = -1;
const banner = document.querySelector('#banner');
const fly = (i) => { playing = i; infRound = 0; banner.hidden = false; banner.textContent = `FLYING M${String(i + 1).padStart(2, '0')} ${MISSIONS[i] ? MISSIONS[i].name : ''} · P/Esc pause · K crash · L complete`; };
// manual mode stand-in for an INFINITY run: L clears a round, K ends the run
let infRound = 0;
const flyInfinity = () => { playing = 0; infRound = 1; banner.hidden = false; banner.textContent = 'FLYING INFINITY · round 1 · P/Esc pause · L clear round · K shot down'; };
const ground = () => { banner.hidden = true; };
const settings = loadSettings();
const menuOpts = {
  settings, missions: MISSIONS,
  onStart: (i) => { calls.push(['start', i]); if (!selfTest) fly(i); },
  onResume: () => { calls.push(['resume']); },
  onRestart: () => { calls.push(['restart']); if (!selfTest) fly(Math.max(0, playing)); },
  onNext: () => { calls.push(['next']); if (!selfTest) fly(Math.min(MISSIONS.length - 1, playing + 1)); },
  onQuit: () => { calls.push(['quit']); if (!selfTest) ground(); },
  onSetting: (k, v) => { calls.push(['set', k, v]); if (!selfTest) console.log(`onSetting ${k} = ${v}`); },
  onSound: (kind) => { sounds[kind] = (sounds[kind] || 0) + 1; },
  onInfinity: () => { calls.push(['infinity']); if (!selfTest) flyInfinity(); },
};
let menu = new Menu(document.querySelector('#ui'), menuOpts);   // replaced for ?install= screenshots (see the end)
window.__menu = menu;

// ---- scripted self-test: fake input edges, deterministic dt ------------------------------------------------------
const results = [];
const check = (name, ok, info) => { results.push({ name, ok: !!ok }); if (!ok) console.log('MENU_FAIL ' + name + (info !== undefined ? ' :: ' + JSON.stringify(info) : '')); };
const near = (a, b, e = 1e-6) => Math.abs(a - b) <= e;
const EDGES = ['menuUp', 'menuDown', 'menuLeft', 'menuRight', 'menuConfirm', 'menuBack', 'pausePressed'];
const NAMES = { up: 'menuUp', down: 'menuDown', left: 'menuLeft', right: 'menuRight', ok: 'menuConfirm', back: 'menuBack', pause: 'pausePressed' };
const fake = { usingGamepad: params.get('dev') !== 'kb' };
const visited = new Set();
const note = () => { if (menu.screen) visited.add(menu.screen); };
const step = (dt, keys = []) => { for (const k of EDGES) fake[k] = false; for (const k of keys) fake[k] = true; menu.update(dt, fake); note(); };
const press = (...names) => { step(1 / 60, names.map((n) => NAMES[n])); step(1 / 60); };
// The menu ignores input for a moment after it opens (0.25 s; 0.8 s for the debrief), timed on the wall clock (Menu.show sets
// _lockUntil from performance.now()), so a fake dt can't skip it: wait out the remaining lock for real, then step.
const settle = async () => { await new Promise((r) => setTimeout(r, Math.max(0, (menu._lockUntil || 0) - performance.now()) + 20)); step(1.0); };
const focused = () => { const f = menu.el.querySelector('.is-focus'); if (!f) return null; const d = f.dataset; return d.act || d.key || d.tab || d.diff || d.kslot || (d.mission !== undefined ? 'm' + d.mission : '?'); };
const last = () => calls[calls.length - 1] || [];
// layout-agnostic: press each direction (up to 4 times) until `target` has focus
const reach = (target, ...dirs) => { for (const d of dirs) for (let i = 0; i < 4 && focused() !== target; i++) press(d); return focused() === target; };
const scr = (n) => menu.el.querySelector(`[data-screen="${n}"]`);
const backup = (() => { try { return localStorage.getItem('wingnut.settings'); } catch { return null; } })();
const bestBackup = (() => { try { return localStorage.getItem(BEST_KEY); } catch { return null; } })();
const pickedBackup = (() => { try { return localStorage.getItem(DIFFICULTY_PICKED_KEY); } catch { return null; } })();
saveDifficultyPicked(true);   // the flows below launch straight away; the first-run picker has its own section near the end
const before = { ...settings };

async function runSelfTest() {
  // Title
  menu.show('title'); note();
  check('opens on title', menu.open && menu.screen === 'title');
  press('ok'); check('input locked right after opening', menu.open && calls.length === 0);
  await settle();
  check('title focus starts on Start Campaign', focused() === 'start', focused());
  press('up'); check('title wraps up to Credits', focused() === 'credits', focused());
  press('down'); check('title wraps down to Start', focused() === 'start', focused());
  press('down'); check('down reaches Infinity, next to the campaign', focused() === 'infinity', focused());
  press('down'); check('down reaches Mission Select', focused() === 'missions', focused());

  // Mission select
  press('ok'); check('Mission Select opens', menu.screen === 'missions');
  check('first mission selected', focused() === 'm0', focused());
  check('21 missions listed', menu.el.querySelectorAll('.m-mis').length === MISSIONS.length && MISSIONS.length === 21, MISSIONS.length);
  press('down'); press('down'); press('down');
  check('down moves through the list', focused() === 'm3', focused());
  check('detail follows the selection', menu.el.querySelector('.m-dname').textContent === MISSIONS[3].name);
  const n3 = countUnits(MISSIONS[3], settings.difficulty);
  const cells = [...menu.el.querySelectorAll('.m-stats > div')].map((c) => `${c.querySelector('span').textContent} ${c.querySelector('b').textContent}`).join(', ');
  check('detail shows only the target counts', cells === `Air ${n3.air}, Ground ${n3.ground}, Naval ${n3.naval}`, cells);
  check('detail hides the mission structure', !scr('missions').querySelector('.m-phases') && !/phase/i.test(scr('missions').textContent));
  press('right'); check('right jumps to Launch', focused() === 'launch', focused());
  press('left'); check('left returns to the selected mission', focused() === 'm3', focused());
  press('ok'); check('confirm on a mission launches it', last()[0] === 'start' && last()[1] === 3 && !menu.open, last());

  // Settings from the title
  menu.show('title'); await settle(); press('down'); press('down'); press('down');
  check('title focus on Settings', focused() === 'settings', focused());
  press('ok'); check('Settings opens', menu.screen === 'settings');
  check('settings focus on the active tab', focused() === 'graphics', focused());
  press('down'); check('down enters the first row', focused() === 'quality', focused());
  const q0 = settings.quality;
  press('right'); check('right cycles Quality', settings.quality !== q0 && last()[0] === 'set' && last()[1] === 'quality', [q0, settings.quality]);
  press('left'); check('left cycles back', settings.quality === q0, settings.quality);
  { const opts = SETTING_DEFS.find((d) => d.key === 'quality').options.map((o) => o[0]);
    check('Quality choices: Auto, Very low, Low, Medium, High, Ultra', opts.join() === 'auto,verylow,low,medium,high,ultra', opts);
    check('Very low is labelled', SETTING_DEFS.find((d) => d.key === 'quality').options[1][1] === 'Very low');
    const before = settings.quality;
    menu.setSetting('quality', 'auto'); press('right');
    check('right from Auto picks Very low', settings.quality === 'verylow', settings.quality);
    const row = menu.el.querySelector('.m-row[data-key="quality"]');
    check('the row shows Very low', !!row && /very low/i.test(row.textContent), row && row.textContent);
    press('left'); check('left from Very low returns to Auto', settings.quality === 'auto', settings.quality);
    menu.setSetting('quality', before); }
  press('up'); check('up returns to the tab bar', focused() === 'graphics', focused());
  press('right'); check('right on the tab bar switches tab', focused() === 'controls' && !scr('settings').querySelector('[data-tabpanel="controls"]').hidden, focused());
  press('down'); check('first Controls row is Invert pitch', focused() === 'invertPitch', focused());
  const ip = settings.invertPitch;
  press('right'); check('right flips a toggle', settings.invertPitch === !ip);
  press('ok'); check('confirm flips it back', settings.invertPitch === ip);
  press('down'); check('next row is Mouse sensitivity', focused() === 'mouseSens', focused());
  const ms = settings.mouseSens;
  press('right'); check('slider steps by 0.05', near(settings.mouseSens, Math.min(3, Math.round((ms + 0.05) * 100) / 100)), settings.mouseSens);
  press('down'); check('next row is Mouse keys', focused() === 'mouseKeys', focused());
  const mk = settings.mouseKeys;
  press('right'); check('Mouse keys cycles', settings.mouseKeys !== mk, settings.mouseKeys);
  const desc = menu.el.querySelector('.m-row[data-key="mouseKeys"] .m-desc').textContent;
  check('Mouse keys help follows the preset', desc.toLowerCase().startsWith(settings.mouseKeys), desc);
  check('Camera shake is further down', reach('cameraShake', 'down'), focused());
  press('down'); check('Screen flash row follows Camera shake', focused() === 'screenFlash', focused());
  const sfRow = menu.el.querySelector('.m-row[data-key="screenFlash"]'), csRow = menu.el.querySelector('.m-row[data-key="cameraShake"]');
  check('Screen flash is a switch row like Camera shake', sfRow.classList.contains('m-row--toggle') && csRow.classList.contains('m-row--toggle') &&
    sfRow.getAttribute('role') === 'switch' && sfRow.querySelector('.m-label').textContent === 'Screen flash' && sfRow.querySelectorAll('.m-seg button').length === 2);
  const sf = settings.screenFlash;
  press('right'); check('right flips Screen flash', settings.screenFlash === !sf && last()[1] === 'screenFlash' && last()[2] === !sf, last());
  press('ok'); check('confirm flips Screen flash back', settings.screenFlash === sf, settings.screenFlash);
  const sfSeg = (v) => sfRow.querySelector(`.m-seg [data-val="${v}"]`);
  sfSeg(!sf).click(); check('tapping a Screen flash segment sets it', settings.screenFlash === !sf && sfSeg(!sf).classList.contains('is-on'), settings.screenFlash);
  sfSeg(sf).click(); check('tapping the other segment sets it back', settings.screenFlash === sf && sfRow.getAttribute('aria-checked') === String(sf));
  // Stick expo rows (pitch / roll / rudder) under Screen flash, with the response graph below them
  press('down'); check('next row is Stick expo pitch', focused() === 'expoPitch', focused());
  const exRow = (k) => menu.el.querySelector(`.m-row[data-key="${k}"]`), exVal = (k) => exRow(k).querySelector('.m-val').textContent;
  check('expo rows are sliders defaulting to the raised expo', ['expoPitch', 'expoRoll', 'expoYaw'].every((k) => exRow(k).classList.contains('m-row--slider') &&
    DEFAULT_SETTINGS[k] === STICK_EXPO) && STICK_EXPO === 0.9, STICK_EXPO);
  const ep0 = settings.expoPitch;
  press('right'); check('right steps expo finely (+0.02)', near(settings.expoPitch, Math.min(1, Math.round((ep0 + 0.02) * 100) / 100)) && last()[1] === 'expoPitch', [ep0, settings.expoPitch]);
  press('left'); check('left steps it back', near(settings.expoPitch, ep0), settings.expoPitch);
  for (let i = 0; i < 10; i++) step(1 / 60, ['menuLeft']);   // a held-repeat burst (input.js repeats held left/right)
  step(1 / 60);
  check('repeated left edges keep stepping', near(settings.expoPitch, Math.round((ep0 - 0.2) * 100) / 100), settings.expoPitch);
  check('expo value label', exVal('expoPitch') === Math.round(settings.expoPitch * 100) + '%', exVal('expoPitch'));
  const cv = menu.el.querySelector('.m-expo-c'), head = menu.el.querySelector('.m-expo-h');
  const padIn = { ...fake, gamepadConnected: true, stickRaw: { pitch: 0.6, roll: -0.3, yaw: 0 } };
  menu.update(1 / 60, padIn);
  check('graph drawn for the focused axis with the live stick dot', cv && cv.width > 0 && head.textContent === 'Pitch response' && /^pitch\|.*\|0\.600$/.test(menu._expoSig), menu._expoSig);
  press('down'); check('next row is Stick expo roll', focused() === 'expoRoll', focused());
  menu.update(1 / 60, padIn);
  check('graph follows the selected row (roll, |deflection| dot)', head.textContent === 'Roll response' && /^roll\|.*\|0\.300$/.test(menu._expoSig), menu._expoSig);
  menu.update(1 / 60, { ...fake, gamepadConnected: false });
  check('no stick dot without a gamepad', /\|-1\.000$/.test(menu._expoSig), menu._expoSig);
  press('down'); check('next row is Stick expo rudder', focused() === 'expoYaw', focused());
  for (let i = 0; i < 60; i++) step(1 / 60, ['menuLeft']);
  step(1 / 60);
  check('rudder expo bottoms out at 0 = Linear', settings.expoYaw === 0 && exVal('expoYaw') === 'Linear', [settings.expoYaw, exVal('expoYaw')]);
  { // touch / mouse drag
    const ysl = exRow('expoYaw').querySelector('.m-slider'), yr = ysl.getBoundingClientRect();
    const ype = (type, fx) => ysl.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerType: 'touch', button: 0, pointerId: 9, clientX: yr.left + yr.width * fx, clientY: yr.top + yr.height / 2 }));
    ype('pointerdown', 0.2); ype('pointermove', 0.5); ype('pointerup', 0.5);
    check('dragging the rudder expo slider sets it', near(settings.expoYaw, 0.5, 0.011) && last()[1] === 'expoYaw', settings.expoYaw);
  }
  { // the settings apply to the stick shaping (main.js applySetting -> Input.setExpo)
    const inp = new Input(window);
    for (const [k, a] of [['expoPitch', 'pitch'], ['expoRoll', 'roll'], ['expoYaw', 'yaw']]) inp.setExpo(a, settings[k]);
    check('Input.setExpo takes the setting values', inp.expo.pitch === settings.expoPitch && inp.expo.yaw === settings.expoYaw && inp.expo.roll === settings.expoRoll, inp.expo);
    check('shaping follows the expo (0.5 rudder: half stick ~ 0.27)', near(shapeAxis(0.5, settings.expoYaw), 0.5 * (0.38 / 0.88) ** 3 + 0.5 * (0.38 / 0.88), 1e-9));
    inp.dispose();
  }
  const expoSet = { pitch: settings.expoPitch, roll: settings.expoRoll, yaw: settings.expoYaw };
  check('graph only redraws on change', (() => { menu.update(1 / 60, { ...fake }); const sig = menu._expoSig, cvw = cv.width; let drew = false; const g = cv.getContext('2d'), o = g.clearRect; g.clearRect = function (...a) { drew = true; return o.apply(this, a); }; menu.update(1 / 60, { ...fake }); g.clearRect = o; return menu._expoSig === sig && !drew && cv.width === cvw; })());
  check('back up to Screen flash', reach('screenFlash', 'up', 'up', 'up'), focused());
  press('up'); check('up returns to Camera shake', focused() === 'cameraShake', focused());
  press('back'); check('Back returns to the title', menu.screen === 'title' && focused() === 'settings', [menu.screen, focused()]);
  let saved = null; try { saved = JSON.parse(localStorage.getItem('wingnut.settings')); } catch { /* blocked */ }
  check('settings persisted on Back', saved && saved.mouseKeys === settings.mouseKeys && saved.mouseSens === settings.mouseSens, saved);
  check('loadSettings reads them back', loadSettings().mouseKeys === settings.mouseKeys);
  check('stick expo persisted', saved && saved.expoPitch === expoSet.pitch && saved.expoRoll === expoSet.roll && saved.expoYaw === expoSet.yaw &&
    loadSettings().expoYaw === expoSet.yaw, saved);
  // Screen flash is off by default, and a save made before the key existed loads with that default
  check('Screen flash defaults Off', DEFAULT_SETTINGS.screenFlash === false);
  try {
    const keep = localStorage.getItem('wingnut.settings');
    localStorage.setItem('wingnut.settings', JSON.stringify({ quality: 'high', cameraShake: false, subtitles: false }));
    const old = loadSettings();
    if (keep === null) localStorage.removeItem('wingnut.settings'); else localStorage.setItem('wingnut.settings', keep);
    localStorage.setItem('wingnut.settings', JSON.stringify({ quality: 'verylow' }));
    check('a saved Very low loads back', loadSettings().quality === 'verylow', loadSettings().quality);
    if (keep === null) localStorage.removeItem('wingnut.settings'); else localStorage.setItem('wingnut.settings', keep);
    check('an older save loads Screen flash Off', old.screenFlash === false && old.cameraShake === false && old.quality === 'high', old);
    check('an older save loads the default stick expo', old.expoPitch === STICK_EXPO && old.expoRoll === STICK_EXPO && old.expoYaw === STICK_EXPO, old);
  } catch { /* storage blocked */ }

  // Audio tab via show() (stacks on the title)
  menu.show('settings', { tab: 'audio' }); step(1 / 60);
  check('show(settings, {tab}) opens that tab', focused() === 'audio' && !scr('settings').querySelector('[data-tabpanel="audio"]').hidden, focused());
  press('down'); check('first Audio row is Master', focused() === 'master', focused());
  const mv = settings.master;
  press('left'); check('Master -5%', near(settings.master, Math.max(0, Math.round((mv - 0.05) * 100) / 100)), settings.master);
  press('right'); check('Master back', near(settings.master, mv), settings.master);
  check('slider value label', menu.el.querySelector('.m-row[data-key="master"] .m-val').textContent === Math.round(settings.master * 100) + '%');
  press('back'); check('Back from stacked Settings returns to title', menu.screen === 'title', menu.screen);

  // Controls and credits
  press('down'); check('focus on Controls', focused() === 'controls', focused());
  press('ok'); check('Controls opens', menu.screen === 'controls' && focused() === 'back', [menu.screen, focused()]);
  check('three control cards', scr('controls').querySelectorAll('.m-card').length === 3);
  check('keyboard card shows the preset', scr('controls').querySelector('.m-card--kb h3 small').textContent.toLowerCase().startsWith(settings.mouseKeys));
  const body = scr('controls').querySelector('.m-body');
  press('down');
  // the scroll is smooth (scrollBy behavior 'smooth'): give it up to 2 s on a slow (software-rendered) page
  for (let i = 0; i < 40 && !(body.scrollTop > 0) && body.scrollHeight > body.clientHeight + 1; i++) await new Promise((r) => setTimeout(r, 50));
  check('down scrolls the controls', body.scrollTop > 0 || body.scrollHeight <= body.clientHeight + 1, [body.scrollTop, body.scrollHeight, body.clientHeight]);
  press('back'); press('down'); check('focus on Credits', focused() === 'credits', focused());
  press('ok'); check('Credits opens', menu.screen === 'credits');
  check('credits rendered from CREDITS', scr('credits').querySelectorAll('.m-credit').length === CREDITS.length);
  press('back'); check('back to title from credits', menu.screen === 'title');

  // Pause
  menu.hide(); check('hide closes', !menu.open && menu.screen === null);
  menu.show('pause', { missionIndex: 2 });
  press('back'); check('Esc that opened pause is ignored', menu.open && menu.screen === 'pause');
  await settle();
  check('pause focus on Resume', focused() === 'resume', focused());
  check('pause names the mission', menu.el.querySelector('.m-pause-sub').textContent.includes(MISSIONS[2].name));
  press('down'); check('focus Restart Mission', focused() === 'restart', focused());
  press('ok'); check('restart asks for confirmation', menu.screen === 'confirm' && focused() === 'back', [menu.screen, focused()]);
  check('pause stays visible under the dialog', !scr('pause').hidden && scr('pause').classList.contains('m-under'));
  press('back'); check('Cancel returns to pause on Restart', menu.screen === 'pause' && focused() === 'restart', [menu.screen, focused()]);
  press('ok'); check('the confirm button is reachable', reach('confirm-yes', 'left', 'up'), focused());
  press('ok'); check('confirm fires onRestart and closes', last()[0] === 'restart' && !menu.open, last());
  menu.show('pause'); await settle(); press('up'); check('pause wraps to Quit', focused() === 'quit', focused());
  press('ok'); reach('confirm-yes', 'left', 'up'); press('ok');
  check('quit fires onQuit and shows the title', last()[0] === 'quit' && menu.screen === 'title', [last(), menu.screen]);
  menu.hide(); menu.show('pause'); await settle(); press('down'); press('down'); press('ok');
  check('Settings from pause', menu.screen === 'settings');
  press('pause'); check('Start/P resumes from a pause sub-screen', last()[0] === 'resume' && !menu.open, last());
  menu.show('pause'); await settle(); press('back'); check('Back at the pause root resumes', last()[0] === 'resume' && !menu.open, last());
  menu.show('pause'); await settle(); press('ok'); check('Resume item resumes', last()[0] === 'resume' && !menu.open, last());
  menu.show('settings'); await settle(); press('back');
  check('a sub-screen opened on its own closes on Back', !menu.open && last()[0] === 'resume', last());

  // Debrief
  menu.show('debrief', { title: 'Mission accomplished', stats: 'SCORE 12,400 · KILLS 14 · TIME 06:21', canNext: true, missionIndex: 4 });
  press('ok'); check('debrief ignores early presses', menu.open && menu.screen === 'debrief');
  await settle();
  check('debrief focus on Next Mission', focused() === 'next', focused());
  check('stats string split into chips', menu.el.querySelectorAll('.m-deb-stats .m-stat').length === 3 && menu.el.querySelector('.m-deb-stats .m-stat b').textContent === '12,400');
  press('ok'); check('Next fires onNext', last()[0] === 'next' && !menu.open, last());
  menu.show('debrief', { title: 'Shot down', stats: [['Score', '900'], ['Kills', 2]], canNext: false, missionIndex: 4 }); await settle();
  check('no Next button after a failure', menu.el.querySelector('[data-screen="debrief"] [data-act="next"]').hidden);
  check('failure focus on Retry', focused() === 'retry', focused());

      fake.padRaw = null;
      try { if (bindBackup === null) localStorage.removeItem(BINDINGS_KEY); else localStorage.setItem(BINDINGS_KEY, bindBackup); } catch { /* blocked */ }
      menu.bindings = loadBindings();
      menu.setSetting('padLayout', layout0);
    }
  }

  // Restore the stored settings (the game shares this origin)
  for (const key of Object.keys(DEFAULT_SETTINGS)) menu.setSetting(key, before[key]);
  menu.hide();
  try { if (backup === null) localStorage.removeItem('wingnut.settings'); else localStorage.setItem('wingnut.settings', backup); } catch { /* blocked */ }
  try { if (bestBackup === null) localStorage.removeItem(BEST_KEY); else localStorage.setItem(BEST_KEY, bestBackup); } catch { /* blocked */ }
  try { if (pickedBackup === null) localStorage.removeItem(DIFFICULTY_PICKED_KEY); else localStorage.setItem(DIFFICULTY_PICKED_KEY, pickedBackup); } catch { /* blocked */ }
  calls.length = 0;
  const fails = results.filter((x) => !x.ok).length;
  console.log(fails ? `MENU_FAIL ${fails}/${results.length} checks failed` : `MENU_OK ${results.length} checks · screens ${[...visited].join(',')} · sounds ${JSON.stringify(sounds)}`);
}

await runSelfTest().catch((e) => console.log('MENU_FAIL exception ' + (e && e.stack || e)));
selfTest = false;

// ---- screenshot / manual mode: ?screen=title|missions|pause|debrief|runover|settings|controls|credits|confirm -------
// (&inf=1 with pause or confirm: the INFINITY pause)
const want = params.get('screen') || 'title';
// &install=ios | prompt: a menu as on iPhone Safari / with Chromium's install prompt (screen=install: the iOS hint)
const instParam = params.get('install') || (want === 'install' ? 'ios' : '');
if (instParam) {
  menu.dispose();
  menu = window.__menu = new Menu(document.querySelector('#ui'), { ...menuOpts, installEnv: instParam === 'ios'
    ? { ua: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1', platform: 'iPhone', touchPoints: 5, standalone: false, manifest: true }
    : { ua: navigator.userAgent, platform: 'Linux x86_64', touchPoints: 0, standalone: false, manifest: true } });
  if (instParam === 'prompt') { const ev = new Event('beforeinstallprompt', { cancelable: true }); ev.prompt = () => { console.log('MENU_PROMPT'); return Promise.resolve({ outcome: 'dismissed' }); }; window.dispatchEvent(ev); }
}
menu.setControllerStatus(params.get('pad') === '0' ? 'No controller. Press any pad button, or use mouse aim.' : 'Controller ready: Xbox Wireless Controller', params.get('pad') !== '0');
menu.setQualityLabel('AUTO · MEDIUM');
if (params.get('dev')) menu.setDevice(params.get('dev'));
if (want === 'pause' || want === 'confirm') menu.show('pause', params.get('inf') === '1' ? { mode: 'infinity', round: 7 } : { missionIndex: 2 });
else if (want === 'runover') menu.show('debrief', { mode: 'infinity', title: 'Shot down', round: 12, roundsCleared: 11, kills: 64, score: 152300, best: 152300, newBest: params.get('best') !== '0' });
else if (want === 'debrief') {
  const win = params.get('win') !== '0';
  menu.show('debrief', win ? { title: 'Mission accomplished', stats: 'SCORE 48,250 · KILLS 23 · TIME 07:42', canNext: true, missionIndex: 2 }
    : { title: 'Shot down', stats: 'SCORE 12,400 · PHASE 2/3 · KILLS 9', canNext: false, missionIndex: 2 });
} else if (want === 'title') menu.show('title');
else { menu.show('title'); menu.show(want, { tab: params.get('tab') || undefined, selected: params.has('sel') ? Number(params.get('sel')) : undefined }); }
await settle();
if (want === 'confirm') { press('up'); press('ok'); }
for (const n of (params.get('nav') || '').split(',').filter(Boolean)) press(n);
if (params.get('dev')) menu.setDevice(params.get('dev'));
console.log(`MENU_SCREEN ${menu.screen} focus=${focused()}`);

// ---- live loop with the real input module (keyboard + gamepad) -------------------------------------------------
const input = new Input(window);
window.addEventListener('keydown', (e) => {
  if (menu.open || playing < 0) return;
  if (infRound > 0) {
    if (e.code === 'KeyL') { infRound++; banner.textContent = `FLYING INFINITY · round ${infRound} · P/Esc pause · L clear round · K shot down`; }
    if (e.code === 'KeyK') { ground(); menu.show('debrief', { mode: 'infinity', title: 'Shot down', round: infRound, roundsCleared: infRound - 1, kills: 6 * infRound, score: 2300 * infRound, best: 48250, newBest: 2300 * infRound > 48250 }); }
    return;
  }
  if (e.code === 'KeyK') { ground(); menu.show('debrief', { title: 'Shot down', stats: 'SCORE 3,150 · KILLS 4', canNext: false, missionIndex: playing }); }
  if (e.code === 'KeyL') { ground(); menu.show('debrief', { title: 'Mission accomplished', stats: 'SCORE 21,900 · KILLS 17', canNext: playing < MISSIONS.length - 1, missionIndex: playing }); }
});
let t0 = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
  input.update(dt);
  if (menu.open) menu.update(dt, input);
  else if (playing >= 0 && input.pausePressed) { banner.hidden = true; menu.show('pause', infRound > 0 ? { mode: 'infinity', round: infRound } : { missionIndex: playing }); }
  else if (playing >= 0) banner.hidden = false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
