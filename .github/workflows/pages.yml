name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: node tools/build.mjs --min

      - name: Assemble site
        run: |
          mkdir -p _site
          # dist/wingnut_local.html is the standalone full page; dist/wingnut.html is only the page body.
          cp dist/wingnut_local.html _site/index.html
          # home-screen install: the web app manifest and its icons (committed PNGs, copied into dist/ by the build)
          cp dist/manifest.webmanifest _site/
          cp -r dist/icons _site/icons
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
