<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WINGNUT — tunnel test</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}
#info{position:absolute;left:8px;top:8px;color:#9f9;font:12px monospace;text-shadow:0 0 3px #000;pointer-events:none;white-space:pre}</style>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js';
import { World } from './js/world.js';
import { PostFX } from './js/post.js';
import { Tunnel } from './js/tunnel.js';

// URL parameters (all optional):
//   view=approach|inside|aerial|side|grid   camera preset (default approach); grid = approach, inside, aerial, side in a 2x2 mosaic
//     approach: 600 m out from a portal, looking at it    inside: flying through the bore at 200 m/s behind a jet
//     aerial: high above, the ridge in the landscape        side: low over the sea, looking at the ridge's flank
//   portal=0|1      which portal the approach view looks at (0 = south, 1 = north)
//   t=<s>           freeze the clock (camera path + world animation) for deterministic screenshots
//   q=low|medium|high|ultra   world.setQuality(q) (default high)
//   cam=x,y,z,lx,ly,lz   fixed camera position and look-at point (overrides view; A/B screenshots at any distance)
//   lod=0|1|2       pin the ridge's distance LOD (A/B against lod=0)
//   jet=0           no jet mesh (scale reference) in the approach / inside views
//   hide=tunnel     hide the tunnel meshes (A/B screenshots)
//   prof=1          GPU timer queries: scene pass with the tunnel vs. without it, and per tunnel mesh; logs TUNNEL_PROF.
//                   With view=a,b,c the views are profiled one after another (600 frames each) in a single page load.
window.addEventListener('error', (e) => console.error('TUNNEL_ERROR ' + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => console.error('TUNNEL_ERROR ' + (e.reason && e.reason.message || e.reason)));

try {
  const params = new URLSearchParams(location.search);
  const view = params.get('view') || 'approach';
  const portal = Number(params.get('portal') || 0) ? 1 : 0;
  const fixedT = params.has('t') ? Number(params.get('t')) : null;
  const info = document.getElementById('info');

  const grid = view === 'grid';
  const GW = grid ? Math.floor(innerWidth / 2) : innerWidth, GH = grid ? Math.floor(innerHeight / 2) : innerHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', alpha: false, stencil: false });
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setPixelRatio(1);
  renderer.setSize(GW, GH);
  document.body.appendChild(renderer.domElement);
  let mosaic = null;
  if (grid) {
    // each view is rendered at quarter size and copied into this 2D canvas right away; the 2D canvas covers the GL one
    // (a display:none GL canvas gets a low-precision back buffer in headless Chrome: posterized captures)
    const cv = document.createElement('canvas'); cv.width = GW * 2; cv.height = GH * 2;
    cv.style.cssText = 'position:absolute;left:0;top:0;z-index:1;width:' + GW * 2 + 'px;height:' + GH * 2 + 'px';
    document.body.appendChild(cv); mosaic = cv.getContext('2d');
  }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(66, GW / GH, 1, 60000);

  let t0 = performance.now();
  const world = new World(scene, renderer);
  if (world.setQuality) world.setQuality(params.get('q') || 'high');
  const worldMs = performance.now() - t0;
  t0 = performance.now();
  const tunnel = new Tunnel(scene, world);
  const tunnelMs = performance.now() - t0;
  const post = new PostFX(renderer, GW, GH, 1, { samples: 4 });
  console.log(`world ${worldMs.toFixed(0)} ms, tunnel ${tunnelMs.toFixed(1)} ms (phases ${JSON.stringify(Object.fromEntries(Object.entries(tunnel.buildTimes || {}).map(([k, v]) => [k, +v.toFixed(1)])))}), length ${tunnel.length.toFixed(0)} m, floor ${tunnel.floorRange.map((v) => v.toFixed(1)).join('..')} m ASL, bore ${tunnel.boreWidth}x${tunnel.boreHeight} m, tris ${tunnel.triangles}`);
  if (params.has('lod')) tunnel.forceLod = Number(params.get('lod'));   // lod=0|1|2 pins the ridge's distance LOD
  if (params.get('hide') === 'tunnel') for (const m of tunnel.meshes) m.visible = false;

  // jet for scale (optional module; the page works without it)
  let jet = null;
  if (params.get('jet') !== '0' && (view === 'inside' || view === 'approach' || grid)) {
    try { const mod = await import('./js/aircraft.js'); jet = mod.buildJetMesh(); scene.add(jet); } catch (e) { console.log('jet mesh unavailable: ' + e.message); }
  }

  // ---- collide() / isInside() probes
  const F = {}, F1 = {}, F2 = {}, F3 = {};
  const fr = (s, o = F) => tunnel._frameAt(s, o);
  const probes = [];
  const probe = (label, p, expect) => {
    const c = tunnel.collide(p), ins = tunnel.isInside(p), t = tunnel.closestPathT(p);
    probes.push(`${label}: collide=${c} inside=${ins} t=${t.toFixed(3)}${expect !== undefined ? (c === expect ? ' ok' : ' MISMATCH') : ''}`);
  };
  {
    const f = fr(tunnel.length * 0.5), rx = -f.tz, rz = f.tx;
    probe('bore centre', new THREE.Vector3(f.x, f.fy + 23, f.z), null);
    probe('near right wall (x=+33)', new THREE.Vector3(f.x + rx * 33, f.fy + 23, f.z + rz * 33), 'wall');
    probe('floor (y=+2)', new THREE.Vector3(f.x, f.fy + 2, f.z), 'wall');
    probe('inside rock (x=-90, y=+40)', new THREE.Vector3(f.x - rx * 90, f.fy + 40, f.z - rz * 90), 'wall');
    probe('above ridge (y=+600)', new THREE.Vector3(f.x, f.fy + 600, f.z), null);
    probe('open sky (0,800,0)', new THREE.Vector3(0, 800, 0), null);
    const E = tunnel.entrances[0];
    probe('S portal, 20 m out on axis', E.position.clone().addScaledVector(E.direction, -20), null);
    probe('S portal face beside opening', E.position.clone().addScaledVector(E.direction, -2).add(new THREE.Vector3(E.direction.z, 0, -E.direction.x).multiplyScalar(70)), 'wall');
  }
  console.log('TUNNEL_PROBES ' + probes.join(' | '));

  // ---- draw-call / triangle counting for the tunnel meshes
  let tCalls = 0, tTris = 0;
  for (const m of tunnel.meshes) {
    const prev = m.onAfterRender;
    m.onAfterRender = function (...a) { const n = Math.min(m.geometry.index.count - m.geometry.drawRange.start, m.geometry.drawRange.count) / 3; if (n > 0) { tCalls++; tTris += n; } prev.apply(this, a); };   // (drawRange count 0: no draw)
  }

  // ---- GPU profiler (EXT_disjoint_timer_query_webgl2): frame % 3 == 0 scene pass with the tunnel, == 1 without it,
  //      == 2 per tunnel mesh (queries cannot nest, so the modes alternate)
  const prof = params.has('prof') ? (() => {
    const gl = renderer.getContext();
    const ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
    if (!ext) { console.log('TUNNEL_PROF unsupported'); return null; }
    const pool = [], pending = [], samples = {};
    let active = null, frameNo = 0;
    const begin = (label) => { if (active) return; const q = pool.pop() || gl.createQuery(); gl.beginQuery(ext.TIME_ELAPSED_EXT, q); active = { q, label, frame: frameNo }; };
    const end = () => { if (!active) return; gl.endQuery(ext.TIME_ELAPSED_EXT); pending.push(active); active = null; };
    const perFrame = new Map();
    for (const m of tunnel.meshes) {
      const b = m.onBeforeRender, a = m.onAfterRender;
      m.onBeforeRender = function (...args) { b.apply(this, args); if (frameNo % 3 === 2) begin(m.name); };
      m.onAfterRender = function (...args) { if (frameNo % 3 === 2) end(); a.apply(this, args); };
    }
    return {
      mode() { return frameNo % 3; },
      pass: { beginPass(label) { if (label === 'scene' && frameNo % 3 < 2) begin(frameNo % 3 === 0 ? 'sceneOn' : 'sceneOff'); }, endPass() { if (frameNo % 3 < 2) end(); } },
      frameEnd(warm) {
        const disjoint = gl.getParameter(ext.GPU_DISJOINT_EXT);
        while (pending.length) {
          const p = pending[0];
          if (!gl.getQueryParameter(p.q, gl.QUERY_RESULT_AVAILABLE)) break;
          const ms = gl.getQueryParameter(p.q, gl.QUERY_RESULT) / 1e6;
          pending.shift(); pool.push(p.q);
          if (disjoint || p.frame < warm) continue;
          const k = p.frame + ':' + p.label; perFrame.set(k, (perFrame.get(k) || 0) + ms);
        }
        frameNo++;
      },
      reset() { perFrame.clear(); for (const k of Object.keys(samples)) delete samples[k]; },
      report() {
        for (const [k, ms] of perFrame) { const label = k.split(':')[1]; (samples[label] = samples[label] || []).push(ms); }
        perFrame.clear();
        const med = (a) => { const s = a.slice().sort((x, y) => x - y); return s.length ? +s[s.length >> 1].toFixed(3) : 0; };
        const out = {};
        for (const k of Object.keys(samples)) out[k] = med(samples[k]);
        out.delta = +((out.sceneOn || 0) - (out.sceneOff || 0)).toFixed(3);
        out.n = samples.sceneOn ? samples.sceneOn.length : 0;
        return out;
      },
    };
  })() : null;
  if (prof) post.profiler = prof.pass;

  if (!grid) window.addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight); post.setSize(innerWidth, innerHeight, 1);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  });

  // ---- camera presets
  const E = tunnel.entrances[portal];
  const c = tunnel.center;
  const _look = new THREE.Vector3(), _a = new THREE.Vector3(), _b = new THREE.Vector3(), _q = new THREE.Quaternion(), _m = new THREE.Matrix4();
  const UP = new THREE.Vector3(0, 1, 0);
  const CAM = params.has('cam') ? params.get('cam').split(',').map(Number) : null;
  function place(view, t) {
    if (jet) jet.visible = view === 'inside' || view === 'approach';
    if (CAM) { if (jet) jet.visible = false; camera.position.set(CAM[0], CAM[1], CAM[2]); camera.up.copy(UP); camera.lookAt(CAM[3], CAM[4], CAM[5]); return; }
    if (view === 'inside') {
      // fly through at 200 m/s, chase camera 30 m behind and 6 m above a jet on the bore axis
      const L = tunnel.length, sj = 60 + ((t * 200) % (L - 120));
      const f = fr(sj, F1);
      const wob = Math.sin(t * 0.9) * 9;
      _a.set(f.x + (-f.tz) * wob, f.fy + 21 + Math.sin(t * 1.3) * 4, f.z + f.tx * wob);
      const fc = fr(sj - 30, F2);
      camera.position.set(fc.x + (-fc.tz) * wob * 0.8, fc.fy + 27 + Math.sin(t * 1.3) * 3, fc.z + fc.tx * wob * 0.8);
      const fl = fr(sj + 90, F3);
      _look.set(fl.x + (-fl.tz) * wob * 0.5, fl.fy + 22, fl.z + fl.tx * wob * 0.5);
      camera.up.copy(UP); camera.lookAt(_look);
      if (jet) {
        const ft = fr(sj + 12, F3);
        _b.set(ft.x + (-ft.tz) * wob, ft.fy + 21 + Math.sin(t * 1.3) * 4, ft.z + ft.tx * wob);
        jet.position.copy(_a);
        _m.lookAt(_b, _a, UP);   // nose (-Z) toward the point ahead
        jet.quaternion.setFromRotationMatrix(_m);
        jet.rotateZ(-Math.cos(t * 0.9) * 0.35);
      }
    } else if (view === 'aerial') {
      const a = 0.35 + (fixedT === null ? t * 0.01 : 0);
      camera.position.set(c.x - 3200 * Math.cos(a), 2300, c.z + 3200 * Math.sin(a) + 900);
      camera.up.copy(UP); camera.lookAt(c.x + 150, 80, c.z + 250);
    } else if (view === 'side') {
      const f = fr(tunnel.length * 0.45), rx = -f.tz, rz = f.tx;
      camera.position.set(f.x - rx * 1500, 120, f.z - rz * 1500 + 600);
      camera.up.copy(UP); camera.lookAt(f.x, 140, f.z);
    } else {
      // approach: 600 m out along the axis, slightly above the opening, looking at it
      const d = 600 - (fixedT === null ? 0 : 0);
      camera.position.copy(E.position).addScaledVector(E.direction, -d); camera.position.y += 28;
      camera.up.copy(UP); camera.lookAt(E.position.x, E.position.y + 30, E.position.z);
      if (jet) {
        _a.copy(E.position).addScaledVector(E.direction, -d + 45); _a.y += 18;
        _b.copy(_a).add(E.direction);
        _m.lookAt(_b, _a, UP); jet.quaternion.setFromRotationMatrix(_m);
        jet.position.copy(_a);
      }
    }
  }

  const GRID_VIEWS = ['approach', 'inside', 'aerial', 'side'];
  const viewList = grid ? GRID_VIEWS : view.split(',');
  let seqIdx = 0, seqStart = 0;
  let last = performance.now() / 1000, frames = 0, reported = false, okLogged = false;
  function frame() {
    const now = performance.now() / 1000;
    const dt = Math.min(0.1, now - last); last = now;
    const t = fixedT !== null ? fixedT : frames / 60;
    const hideNow = params.get('hide') === 'tunnel' || (prof && prof.mode() === 1);
    for (const m of tunnel.meshes) m.visible = !hideNow;
    const views = grid ? GRID_VIEWS : [viewList[seqIdx]];
    for (let vi = 0; vi < views.length; vi++) {
      place(views[vi], t);
      camera.updateMatrixWorld();
      world.update(dt, camera, t);
      tCalls = 0; tTris = 0;
      post.render(scene, camera, dt);
      if (mosaic) {
        const x = (vi % 2) * GW, y = (vi >> 1) * GH;
        mosaic.drawImage(renderer.domElement, x, y);
        mosaic.font = '13px monospace'; mosaic.fillStyle = '#9f9'; mosaic.fillText(views[vi], x + 8, y + 18);
      }
    }
    const info2 = renderer.info.render;
    frames++;
    if (prof && !reported) {
      prof.frameEnd(seqStart + 60);
      if (frames - seqStart === 600) {
        console.log('TUNNEL_PROF view=' + views[0] + ' ' + JSON.stringify(prof.report()));
        prof.reset();
        if (seqIdx < viewList.length - 1) { seqIdx++; seqStart = frames; } else reported = true;
      }
    }
    if (frames === 3 && !okLogged) {
      okLogged = true;
      const ents = tunnel.entrances.map((e) => ({ name: e.name, position: e.position.toArray().map((v) => +v.toFixed(1)), direction: e.direction.toArray().map((v) => +v.toFixed(3)) }));
      console.log(`TUNNEL_OK calls=${tCalls} tris=${tTris} entrances=${JSON.stringify(ents)} frameCalls=${info2.calls} frameTris=${info2.triangles} camInside=${tunnel.isInside(camera.position)}`);
    }
    if (frames % 30 === 0) info.textContent = `${views[0]}  cam ${camera.position.x.toFixed(0)},${camera.position.y.toFixed(0)},${camera.position.z.toFixed(0)}  tunnel calls ${tCalls} tris ${tTris}  inside ${tunnel.isInside(camera.position)}  t ${tunnel.closestPathT(camera.position).toFixed(2)}`;
    requestAnimationFrame(frame);
  }
  frame();
} catch (e) {
  console.error('TUNNEL_ERROR ' + (e && e.stack || e));
}
</script>
</body>
</html>
